# Refreshes the parking map on sijpesteijn.pages.dev: daily at 12:00 and 19:00 Dutch time, and right away when
# the scan button on the site starts this workflow (at most once an hour). "Run workflow" here also scans right away.
name: Parkeerscan

on:
  schedule:
    # 12:00 and 19:00 in Amsterdam are 11:00/18:00 UTC in winter and 10:00/17:00 UTC in summer;
    # scan_parking.ps1 skips the run that does not land on 12 or 19 o'clock
    - cron: '2 10,11,17,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parkeerscan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan ikwilhuren.nu
        shell: pwsh
        env:
          PARKING_KEY: ${{ secrets.PARKING_KEY }}
        run: ./scan_parking.ps1 -Force:$${{ github.event_name == 'workflow_dispatch' }}

      # GitHub pauses schedules in repositories without a commit for 60 days
      - name: Keep the schedule running
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Keep the scan schedule running'
            git push
          fi
